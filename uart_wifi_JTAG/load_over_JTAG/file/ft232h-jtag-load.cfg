# ft232h-jtag-load.cfg — конфиг OpenOCD для carto, вариант «загрузка в ОЗУ».
#
# Отличие от file/../../debug_of_FT232H/file/ft232h-jtag.cfg ровно одно:
# кроме подключения к цели здесь объявлены процедуры psych_load/psych_run/
# psych_boot, чтобы всю последовательность можно было выполнить одной
# командой прямо в telnet-консоли (порт 4444), без сборочного сервера.
# Настройки самого адаптера скопированы один-в-один — они проверены на
# железе 2026-08-23 и здесь НЕ трогаются (в частности `layout_signal nTRST`:
# без него JTAG вообще не поднимается, разбор в
# ../../debug_of_FT232H/FT232H-jtag-guide.md, §4).
#
# Установка (один раз): скопировать в ~/jtag/ на carto.
# Запуск:  openocd -f ft232h-jtag-load.cfg
# (board/rpi4b.cfg подтягивается отсюда — второй -f не нужен.)

adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x0008 0x001b
ftdi layout_signal nTRST -data 0x0010
adapter speed 1000

# `transport select jtag` здесь НЕ нужен, в отличие от ft232h-jtag.cfg: там он
# обязателен, потому что board/rpi4b.cfg подключается вторым -f, а здесь мы
# сорсим его сами и он делает select сам. Дубль давал
# `Warn : Transport "jtag" was already selected` (подтверждено на железе 2026-09-06).
source [find board/rpi4b.cfg]

# board/rpi4b.cfg -> target/bcm2711.cfg выставляет 4000 кГц — проверенное на
# железе значение, оставляем его. Заливка 1.9 МБ на нём занимает десятки
# секунд. Поднимать имеет смысл только при коротких (10-15 см) проводах и
# только проверив, что `mdw 0x10000000 4` после заливки читает ровно то же,
# что записали (см. ../JTAG-load-guide.md, §9 — «залилось с ошибками»).
# adapter speed 8000

set PSYCH_IMAGE   /home/nikita/jtag/psych-ward-os.bin
set PSYCH_LOADADDR 0x10000000
set PSYCH_TARGET   bcm2711.cpu0

# Залить образ в ОЗУ. Цель обязана быть остановлена — halt делаем сами.
proc psych_load {{img ""}} {
    global PSYCH_IMAGE PSYCH_LOADADDR PSYCH_TARGET
    if {$img eq ""} { set img $PSYCH_IMAGE }
    targets $PSYCH_TARGET
    halt
    load_image $img $PSYCH_LOADADDR bin
    echo "psych_load: образ $img залит по $PSYCH_LOADADDR"
}

# Выставить точку входа и запустить. x0/x1 обнуляются ради
# воспроизводимости: U-Boot передал бы туда argc/argv из
# do_bootm_standalone(), но elfloader с вшитым DTB их не читает.
proc psych_run {} {
    global PSYCH_LOADADDR PSYCH_TARGET
    targets $PSYCH_TARGET
    reg pc $PSYCH_LOADADDR
    reg x0 0
    reg x1 0
    resume
    targets
}

proc psych_boot {{img ""}} {
    psych_load $img
    psych_run
}

# Спасение после «забыл резюмнуть» — см. ../JTAG-load-guide.md, §9.
proc psych_rescue {} {
    global PSYCH_TARGET
    targets $PSYCH_TARGET
    resume
    targets
}

# Jim Tcl (в отличие от «большого» Tcl) возвращает из `proc` ИМЯ процедуры, а
# OpenOCD печатает результат последней команды конфига. Без этой строки в
# лог попадала болтающаяся строка `psych_rescue` (подтверждено на железе
# 2026-09-06) — выглядит как ошибка, хотя ею не является.
set _ ""
