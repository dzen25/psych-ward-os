# Psych Ward OS — heartbeat-watchdog автовосстановление (см. план "Сигналы
# драйверам", Фаза 4). Одно имя драйвера на строку — must точно совпадать с
# pcbs[].name. Уберите строку, чтобы выключить автовосстановление именно для
# этого драйвера по таймауту heartbeat'а (ручные `driver <name> restart` и
# `recover <name>` продолжают работать независимо от этого файла).
# Файл не найден/не читается -> автовосстановление выключено для ВСЕХ (fail-closed).
blk_driver
net_driver
wifi_driver
usb_driver
