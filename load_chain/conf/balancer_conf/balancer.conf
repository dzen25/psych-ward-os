# Psych Ward OS — настройки сервиса balancer (см. ROADMAP.md, Фаза 9.B).
# Первое число в файле (пустые строки и строки-комментарии до него
# пропускаются) — интервал между авто-запусками SYS_BALANCE, в мс. Парсер
# (src/service/balancer.cpp) не полноценный INI/key=value — комментарии и
# любой прочий текст ПОСЛЕ числа тоже игнорируются, значим только сам
# первый найденный числовой токен. Если файла нет, либо число не нашлось —
# используется встроенное значение по умолчанию (тоже 5000 мс); последний
# случай теперь печатает предупреждение в консоль, а не молчит.
5000
