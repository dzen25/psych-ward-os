# Interface config for the dirtyjtag_bitbang_bridge.py TCP<->USB bridge.
# Pairs with the *stock* OpenOCD remote_bitbang driver - no custom OpenOCD
# build needed. Start the bridge first, then:
#   openocd -f dirtyjtag_remote_bitbang.cfg -f bcm2711.cfg

adapter driver remote_bitbang
remote_bitbang_host localhost
remote_bitbang_port 44444
